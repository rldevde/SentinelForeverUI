name: Feature request
description: Suggest an improvement or new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
      description: Describe the feature and why it would help
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which client/language/module this concerns
